# Configuração base: sem segredos e sem defaults de ambiente.
# Todas as variáveis obrigatórias estão listadas no README ("Variáveis de ambiente").
# Para desenvolvimento local, ative o perfil dev (SPRING_PROFILES_ACTIVE=dev): ele traz defaults locais.
spring:
  application:
    name: lab-manager

  jackson:
    time-zone: America/Sao_Paulo

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway controla o schema; o Hibernate só valida
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

jwt:
  secret: ${JWT_SECRET}                        # obrigatório, mínimo de 32 caracteres
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24h

app:
  # Usada para montar o link de confirmação enviado no e-mail
  base-url: ${APP_BASE_URL}
  mail:
    from: ${MAIL_FROM:no-reply@labmanager.local}
  security:
    login:
      max-attempts: ${AUTH_MAX_ATTEMPTS:5}
      lock-duration: ${AUTH_LOCK_MINUTES:15}m

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /docs

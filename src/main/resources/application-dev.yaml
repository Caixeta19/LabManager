# Perfil dev: defaults para rodar localmente (Postgres do docker-compose e SMTP de teste).
# O JWT_SECRET continua obrigatório também em dev.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/labmanager}
    username: ${DB_USERNAME:labmanager}
    password: ${DB_PASSWORD:labmanager}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    # Mailtrap (README, etapa 5). Nunca use SMTP real em desenvolvimento.
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  front-url: ${APP_FRONT_URL:http://localhost:5173}
  mail:
    # Sem SMTP configurado, escreve no log o link de redefinição de senha. Nunca ative em produção.
    log-reset-link: true

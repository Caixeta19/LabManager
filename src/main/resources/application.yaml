spring:
  application:
    name: lab-manager

  datasource:
    url: jdbc:postgresql://localhost:5432/labmanager
    username: labmanager
    password: labmanager
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway controla o schema, Hibernate so valida
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  # Usada para montar o link de confirmacao enviado no email
  base-url: http://localhost:8080

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /docs
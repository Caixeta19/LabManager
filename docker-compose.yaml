services:
  postgres:
    image: postgres:16
    container_name: lab_manager_db
    environment:
      POSTGRES_DB: labmanager
      POSTGRES_USER: labmanager
      POSTGRES_PASSWORD: labmanager
    ports:
      - "5432:5432"
    volumes:
      - lab_manager_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labmanager -d labmanager"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    container_name: lab_manager_app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    # Variáveis lidas do arquivo .env (copie de .env.example). Ver README, "Variáveis de ambiente".
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/labmanager
      DB_USERNAME: labmanager
      DB_PASSWORD: labmanager
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@labmanager.local}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:8.9
    container_name: lab_manager_pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "15433:80"
    restart: unless-stopped

volumes:
  lab_manager_data: